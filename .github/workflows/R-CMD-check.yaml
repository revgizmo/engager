name: R-CMD-check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  statuses: write

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: |
            any::knitr
            any::lintr
            any::rcmdcheck
            any::rmarkdown
            any::roxygen2
            any::styler

      - name: Lint
        run: |
          lintr::lint_package()
        shell: Rscript {0}

      - name: Generate documentation (roxygenise)
        run: |
          roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-results-${{ runner.os }}
          path: check/

  report-required-status:
    runs-on: ubuntu-latest
    needs: R-CMD-check
    if: always()
    steps:
      - name: Report required R-CMD-check status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ needs.R-CMD-check.result }}" = "success" ]; then
            state="success"
            description="R CMD check matrix passed"
          else
            state="failure"
            description="R CMD check matrix did not pass"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f context="R-CMD-check" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
