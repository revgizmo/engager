name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/benchmarks/**'
      - 'R/**'
      - '.github/workflows/benchmarks.yaml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'scripts/benchmarks/**'
      - 'R/**'
      - '.github/workflows/benchmarks.yaml'
      - 'project-docs/performance/MEASUREMENT_CONTRACT.md'
      - 'perf/README.md'

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    
    env:
      BUDGET_1: '10'
      BUDGET_50: '120'
      BUDGET_500: '1200'
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/R
            ~/.cache/R
          key: ${{ runner.os }}-benchmarks-${{ hashFiles('.github/workflows/benchmarks.yaml') }}
          restore-keys: |
            ${{ runner.os }}-benchmarks-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev time

      - name: Install dependencies and package
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("remotes")
          remotes::install_local(
            ".",
            dependencies = NA,
            build = TRUE,
            force = TRUE,
            upgrade = "never"
          )
          stopifnot(requireNamespace("engager", quietly = TRUE))
        shell: Rscript {0}

      - name: Test measurement contract
        run: Rscript scripts/benchmarks/test_measurement_contract.R

      - name: Run measurements and enforce existing budgets
        env:
          BENCHMARK_RUNNER: ubuntu-latest-${{ runner.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/engager-upload"
          Rscript scripts/benchmarks/measurement_contract.R run "$RUNNER_TEMP/engager-upload/measurements.json"
          Rscript scripts/benchmarks/measurement_contract.R validate "$RUNNER_TEMP/engager-upload/measurements.json"
        timeout-minutes: 120

      - name: Upload validated JSON only
        uses: actions/upload-artifact@v4
        with:
          name: measurements-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/engager-upload/measurements.json
          if-no-files-found: error
