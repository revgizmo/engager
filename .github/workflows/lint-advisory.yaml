name: Lint advisory

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint-advisory:
    name: Lint advisory (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}
      - name: Report current lint findings
        run: |
          lints <- lintr::lint_package()
          print(lints)
          count <- length(lints)
          summary_path <- Sys.getenv("GITHUB_STEP_SUMMARY")
          write(
            c(
              "## Advisory lint report",
              "",
              sprintf("Found %d lint finding(s). This report is non-blocking while the baseline is reduced.", count)
            ),
            file = summary_path,
            append = TRUE
          )
          if (count > 0) {
            cat(sprintf("::warning title=Advisory lint findings::%d finding(s); see the job log.\n", count))
          }
        shell: Rscript {0}
