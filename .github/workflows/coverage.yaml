name: Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  statuses: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage
          extra-packages: |
            any::covr

      - name: Build and install package
        run: |
          R CMD build .
          PKG_TGZ=$(ls -t *.tar.gz | head -1)
          R CMD INSTALL "$PKG_TGZ"
        shell: bash

      - name: Check supported-export coverage
        run: Rscript scripts/check-export-coverage.R

      - name: Report required Coverage status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state="success"
            description="Coverage and supported-export contract passed"
          else
            state="failure"
            description="Coverage or supported-export contract did not pass"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f context="Coverage" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
