name: Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  statuses: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage
          extra-packages: |
            any::covr
            any::roxygen2

      - name: Generate documentation
        run: |
          roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Build and install package
        run: |
          R CMD build .
          PKG_TGZ=$(ls -t *.tar.gz | head -1)
          R CMD INSTALL "$PKG_TGZ"
        shell: bash

      - name: Run coverage on installed package and report (exported API gate)
        id: coverage
        run: |
          library(engager)
          cov <- covr::package_coverage()
          overall <- covr::percent_coverage(cov)
          df <- as.data.frame(cov)
          df <- df[!is.na(df$functions) & nzchar(df$functions), ]
          # Strategic exported API we promise to support
          targets <- c(
            "load_zoom_transcript","process_zoom_transcript","summarize_transcript_metrics",
            "summarize_transcript_files","load_roster","make_clean_names_df","create_session_mapping",
            "plot_users","make_transcripts_summary_df","ensure_privacy","privacy_audit",
            "validate_privacy_compliance","anonymize_educational_data","write_metrics",
            "analyze_transcripts","set_privacy_defaults","basic_transcript_analysis",
            "detect_unmatched_names","match_names_workflow","write_unresolved"
          )
          exports <- intersect(getNamespaceExports("engager"), targets)
          filtered <- df[df$functions %in% exports, , drop = FALSE]
          if (nrow(filtered) > 0) {
            covered_by_fun <- stats::aggregate(list(covered = filtered$value > 0, total = filtered$value >= 0), by = list(functions = filtered$functions), FUN = sum)
            exp_cov <- round(100 * sum(covered_by_fun$covered, na.rm = TRUE) / sum(covered_by_fun$total, na.rm = TRUE), 2)
          } else {
            exp_cov <- NA_real_
          }
          cat(sprintf("overall_coverage=%.2f\n", overall))
          cat(sprintf("exported_coverage=%.2f\n", exp_cov))
          if (is.na(exp_cov)) stop("Exported coverage could not be computed")
          if (exp_cov < 90) {
            message(sprintf("Exported coverage %.2f%% below threshold 90%%", exp_cov))
            quit(status = 1)
          }
        shell: Rscript {0}

      - name: Report required Coverage status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            state="success"
            description="Coverage gate passed"
          else
            state="failure"
            description="Coverage gate did not pass"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f context="Coverage" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
