name: Task
description: Small, bounded repository work with objective acceptance criteria
title: "task: <concise outcome>"
labels: ["type: chore"]
assignees: []
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain why the task is needed and link its owning plan or issue
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define exact in-scope and out-of-scope boundaries
      value: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable pass/fail outcomes rather than implementation activity
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: List targeted checks, the canonical validator, and required hosted gates
      value: |
        - Targeted:
        - Canonical validator: `Rscript scripts/pre-pr-validation.R`
        - Hosted: strict `R-CMD-check` and `Coverage`
  - type: textarea
    id: impact
    attributes:
      label: API, privacy, and release impact
      description: State whether public API, schema, data handling, or the stable release line changes
      value: |
        - Public API/schema:
        - Privacy/data handling:
        - Release line:
  - type: input
    id: links
    attributes:
      label: Related links
      description: Link related issues, pull requests, roadmap sections, or release tranches
