name: Roadmap task
description: Bounded work from the current engager roadmap or release plan
title: "roadmap: <release or lane> - <concise outcome>"
labels: ["roadmap", "task"]
assignees: []
body:
  - type: textarea
    id: roadmap_context
    attributes:
      label: Roadmap context
      description: Link the release, tranche, or maintenance lane that owns this work
      placeholder: "For example: 0.1.1 T2 - session identity and ordering"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User or repository outcome
      description: State the problem and the observable result this task should deliver
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define exact in-scope and out-of-scope boundaries
      value: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective pass/fail behavior, privacy, schema, and validation gates
      value: |
        - [ ] Required behavior is covered by targeted tests.
        - [ ] Privacy and data-handling assertions pass, if applicable.
        - [ ] Public API and schema impact is documented.
        - [ ] Installed-package UAT is defined when required by the release plan.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Give the exact local and hosted checks required for completion
      value: |
        - Targeted:
        - Canonical validator: `Rscript scripts/pre-pr-validation.R`
        - Hosted: strict `R-CMD-check` and `Coverage`
  - type: textarea
    id: risk
    attributes:
      label: Risk and data boundary
      description: Identify privacy, compatibility, rollback, or CRAN-lane risks
      value: |
        - Synthetic fixtures only; no real or private course data.
        - Risk:
        - Rollback:
  - type: input
    id: links
    attributes:
      label: Related links
      description: Link the roadmap, release plan, dependencies, and related issues or pull requests
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Name the human or agent lane responsible for this bounded task
